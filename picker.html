<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract Picker · Kornis Protocol</title>
<style>
:root{--bg:#0B1220;--panel:#121B2E;--panel2:#0F1728;--line:#233150;--gold:#BF9000;--gold-soft:#D9B44A;--text:#E8ECF4;--dim:#8A93A6;--green:#2FB673;--red:#E05B44;--amber:#E0A93F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;padding:14px 12px 90px;max-width:600px;margin:0 auto}
h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);text-align:center;margin-bottom:2px}
.sub{text-align:center;font-size:10px;color:var(--dim);margin-bottom:12px;letter-spacing:.06em}
.bar{display:flex;gap:6px;margin-bottom:8px}
.bar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:#fff;padding:9px;font-size:14px}
.seg{display:flex;gap:5px;margin-bottom:8px}
.seg div{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:9px 0;font-size:12px;font-weight:800;text-align:center;cursor:pointer}
.seg div.onL{background:var(--green);color:#000;border-color:var(--green)}
.seg div.onS{background:var(--red);color:#fff;border-color:var(--red)}
.strat{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.strat>div{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 2px;text-align:center;cursor:pointer;transition:all .12s}
.strat>div.on{background:linear-gradient(135deg,#8a6a14,#BF9000)!important;border-color:#E8C86A!important;box-shadow:0 0 12px rgba(191,144,0,.55);transform:scale(1.04)}
.strat .t{font-size:10.5px;font-weight:800;color:var(--gold-soft)}
.strat>div.on .t{color:#000!important}
.strat .d{font-size:8px;color:var(--dim)}
.strat>div.on .d{color:#3a2c00!important}
button.go{background:var(--gold);color:#000;border:none;border-radius:8px;padding:12px;font-weight:800;cursor:pointer;width:100%;font-size:13px;letter-spacing:.06em;margin-bottom:10px}
#status{font-size:10.5px;color:var(--dim);text-align:center;padding:4px 0 10px}
.best{background:linear-gradient(160deg,#1a1408,#121B2E);border:1.5px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:10px}
.best .tag{font-size:9px;letter-spacing:.2em;color:var(--gold-soft);text-transform:uppercase;margin-bottom:6px}
.best .name{font-size:19px;font-weight:800;color:#fff;margin-bottom:8px}
.best .name span{color:var(--gold-soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gc{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 3px;text-align:center}
.gc .l{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.gc .v{font-size:13px;font-weight:800;color:var(--gold-soft)}
.gc .v.ok{color:var(--green)} .gc .v.bad{color:var(--red)}
.alt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px;font-size:12px;cursor:pointer}
.alt:active{border-color:var(--gold)}
.alt .mk{flex:none;font-size:9px;color:var(--gold-soft);border:1px solid var(--gold);border-radius:5px;padding:2px 6px}
.go2{display:flex;gap:6px;margin-top:9px}
.go2 a{flex:1;text-align:center;background:#0F1728;color:var(--gold-soft);border:1px solid var(--gold);border-radius:7px;padding:9px 0;font-weight:800;font-size:11px;text-decoration:none;cursor:pointer}
.alt .nm{font-weight:800;width:120px;flex:none;color:#fff}
.alt .dt{color:var(--dim);font-size:11px;flex:1}
.alt .dl{font-weight:800;color:var(--gold-soft);flex:none}
.verdict{font-size:11px;padding:8px 12px;border-radius:8px;margin-top:8px;text-align:center}
.verdict.pass{background:rgba(47,182,115,.12);border:1px solid var(--green);color:var(--green)}
.verdict.fail{background:rgba(224,91,68,.12);border:1px solid var(--red);color:var(--red)}
.knav{position:fixed;bottom:0;left:0;right:0;background:#0a1120;border-top:1px solid var(--line);display:flex;z-index:90;padding-bottom:env(safe-area-inset-bottom)}
.knav a{flex:1;text-align:center;padding:10px 0;color:var(--dim);text-decoration:none;font-size:9px;font-weight:700;border-right:1px solid var(--line)}
.knav a:last-child{border-right:none}
.knav a.on{color:var(--gold-soft);border-bottom:2px solid var(--gold)}
</style></head><body>

<h1>Contract Picker</h1>
<div class="sub">NO MORE CHAIN HUNTING — THE PLAYBOOK PICKS, YOU CONFIRM</div>

<div class="bar"><input id="tk" placeholder="SPCX" value="SPCX" autocapitalize="characters"></div>

<div class="seg">
  <div id="segL" class="onL" onclick="setDir('long')">CALLS ▲</div>
  <div id="segS" onclick="setDir('short')">PUTS ▼</div>
</div>

<div class="strat">
  <div data-lo="5" data-hi="10" data-dlo="0.65" data-dhi="0.75" onclick="setStrat(this)"><div class="t">SCALP</div><div class="d">5–10 DTE</div></div>
  <div class="on" data-lo="7" data-hi="14" data-dlo="0.60" data-dhi="0.70" onclick="setStrat(this)"><div class="t">DAY</div><div class="d">7–14 DTE</div></div>
  <div data-lo="14" data-hi="25" data-dlo="0.60" data-dhi="0.70" onclick="setStrat(this)"><div class="t">WEEK</div><div class="d">14–25 DTE</div></div>
  <div data-lo="30" data-hi="45" data-dlo="0.65" data-dhi="0.75" onclick="setStrat(this)"><div class="t">SWING</div><div class="d">30–45 DTE</div></div>
</div>

<button class="go" onclick="pick()">⚡ FIND MY CONTRACT</button>
<div id="status">Pick direction + strategy → tap. Uses the cockpit's cached chain when available.</div>
<div id="out"></div>

<div class="knav">
  <a href="hub.html">COMMAND</a>
  <a href="watchlist.html">SCAN</a>
  <a href="cockpit.html">COCKPIT</a>
  <a href="picker.html" class="on">PICKER</a>
  <a href="coach.html">COACH</a>
  <a href="trades.html">TRADES</a>
  <a href="ledger.html">LEDGER</a>
</div>

<script>
const RELAY='https://kornis-ai-relay.rick-018.workers.dev';
let DIR='long';
function setDir(d){DIR=d;
  document.getElementById('segL').className=d==='long'?'onL':'';
  document.getElementById('segS').className=d==='short'?'onS':'';}
function setStrat(el){document.querySelectorAll('.strat>div').forEach(x=>x.classList.remove('on'));el.classList.add('on');}

function nCDF(x){const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;const s=x<0?-1:1;const ax=Math.abs(x)/Math.sqrt(2);const t=1/(1+p*ax);const y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-ax*ax);return .5*(1+s*y);}
function nPDF(x){return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);}
function bsPrice(S,K,T,r,sg,isC){const st=Math.sqrt(T);const d1=(Math.log(S/K)+(r+.5*sg*sg)*T)/(sg*st);const d2=d1-sg*st;
  return isC?S*nCDF(d1)-K*Math.exp(-r*T)*nCDF(d2):K*Math.exp(-r*T)*nCDF(-d2)-S*nCDF(-d1);}
function bsAll(S,K,T,r,sg,isC){if(T<=0||sg<=0)return null;const st=Math.sqrt(T);
  const d1=(Math.log(S/K)+(r+.5*sg*sg)*T)/(sg*st);const d2=d1-sg*st;
  const delta=isC?nCDF(d1):nCDF(d1)-1;
  const theta=isC?(-S*nPDF(d1)*sg/(2*st)-r*K*Math.exp(-r*T)*nCDF(d2))/365
                 :(-S*nPDF(d1)*sg/(2*st)+r*K*Math.exp(-r*T)*(1-nCDF(d2)))/365;
  return{delta,theta};}
function solveIV(S,K,T,mid,isC){if(!mid||mid<=0.03)return null;let lo=0.05,hi=3.0;
  for(let i=0;i<40;i++){const m2=(lo+hi)/2;if(bsPrice(S,K,T,0.05,m2,isC)>mid)hi=m2;else lo=m2;}return(lo+hi)/2;}

async function getChain(tk){
  try{const c=JSON.parse(localStorage.getItem('kChain_'+tk));
    if(c&&Date.now()-c.ts<45*60000)return{cj:c.cj,cached:Math.round((Date.now()-c.ts)/60000)};}catch(e){}
  const r=await fetch(RELAY+'/?chain='+encodeURIComponent(tk));
  const txt=await r.text();
  let cj;try{cj=JSON.parse(txt);}catch(e){throw new Error(txt.indexOf('1015')>-1?'rate-limited (1015) — open cockpit first or wait 90s':'bad chain response');}
  localStorage.setItem('kChain_'+tk,JSON.stringify({ts:Date.now(),cj}));
  return{cj,cached:0};
}

async function pick(){
  const tk=document.getElementById('tk').value.trim().toUpperCase();
  const st=document.getElementById('status'),out=document.getElementById('out');
  if(!tk)return;
  const s=document.querySelector('.strat div.on');
  const dteLo=+s.dataset.lo,dteHi=+s.dataset.hi,dLo=+s.dataset.dlo,dHi=+s.dataset.dhi;
  st.textContent='Reading chain…';out.innerHTML='';
  let R;try{R=await getChain(tk);}
  catch(e){
    st.textContent='⚠ '+e.message+' — auto-retrying every 90s, leave this page open';
    setTimeout(pick,90000);
    return;
  }
  const cj=R.cj;
  const spot=cj?.data?.current_price??cj?.data?.close??cj?.current_price;
  const raw=cj?.data?.options||cj?.options||[];
  if(!spot||!raw.length){st.textContent='Chain empty.';return;}
  const isC=DIR==='long';const now=new Date();
  const cands=[];
  for(const o of raw){
    const m=(o.option||o.symbol||'').match(/(\d{6})([CP])(\d{8})$/);if(!m)continue;
    if(m[2]!==(isC?'C':'P'))continue;
    const exp=new Date(2000+ +m[1].slice(0,2),+m[1].slice(2,4)-1,+m[1].slice(4,6));
    const dte=Math.ceil((exp-now)/86400000);
    if(dte<dteLo||dte>dteHi)continue;
    const K=+m[3]/1000;
    const bid=+o.bid||0,ask=+o.ask||+o.mid||0;const mid=(bid+ask)/2;
    const spread=ask-bid;
    const oi=+o.open_interest||0;
    let iv=+(o.implied_volatility??o.iv??0)||0;
    if(!iv)iv=solveIV(spot,K,dte/365,mid,isC)||0.55;
    const g=bsAll(spot,K,dte/365,0.05,iv,isC);if(!g)continue;
    const aD=Math.abs(g.delta);
    if(aD<dLo-0.12||aD>dHi+0.12)continue;
    const thPct=mid>0?Math.abs(g.theta)/mid*100:99;
    const liqOK=spread<=0.30&&(mid<=0||spread<=mid*0.05+0.30)&&oi>=500;
    const liqWarn=spread<=0.50&&oi>=100;
    cands.push({K,dte,exp,mid,spread,oi,iv,delta:aD,thPct,liqOK,liqWarn,
      fit:Math.abs(aD-(dLo+dHi)/2)+ (liqOK?0:liqWarn?0.05:0.15)});
  }
  if(!cands.length){st.textContent='No contracts in the '+dteLo+'–'+dteHi+' DTE window at that delta. Try the next strategy over.';return;}
  cands.sort((a,b)=>a.fit-b.fit);
  PK={cands:cands.slice(0,4),tk,isC,spot,cached:R.cached};
  renderPick(0);
  st.textContent=cands.length+' candidates in window · spot $'+(+spot).toFixed(2)+' · tap any alternate to promote it';
}
let PK=null;
function renderPick(ix){
  const P=PK;if(!P)return;
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const b=P.cands[ix];const tk=P.tk,isC=P.isC;
  let h='<div class="best"><div class="tag">'+(ix===0?'★ The Contract':'★ Alternate — promoted by you')+(P.cached?' · chain '+P.cached+'m old':'')+'</div>'
    +'<div class="name">'+tk+' <span>'+fmt(b.exp)+' $'+b.K.toFixed(b.K%1?2:0)+' '+(isC?'CALL':'PUT')+'</span></div>'
    +'<div class="grid">'
    +'<div class="gc"><div class="l">Δ Delta</div><div class="v">'+b.delta.toFixed(2)+'</div></div>'
    +'<div class="gc"><div class="l">Mid</div><div class="v">$'+b.mid.toFixed(2)+'</div></div>'
    +'<div class="gc"><div class="l">Spread</div><div class="v '+(b.spread<=0.30?'ok':'bad')+'">$'+b.spread.toFixed(2)+'</div></div>'
    +'<div class="gc"><div class="l">OI</div><div class="v '+(b.oi>=500?'ok':b.oi>=100?'':'bad')+'">'+b.oi.toLocaleString()+'</div></div>'
    +'<div class="gc"><div class="l">DTE</div><div class="v">'+b.dte+'</div></div>'
    +'<div class="gc"><div class="l">IV</div><div class="v">'+(b.iv*100).toFixed(0)+'%</div></div>'
    +'<div class="gc"><div class="l">Θ/day</div><div class="v '+(b.thPct<=3?'ok':'bad')+'">'+b.thPct.toFixed(1)+'%</div></div>'
    +'<div class="gc"><div class="l">Cost</div><div class="v">$'+(b.mid*100).toFixed(0)+'</div></div>'
    +'</div>'
    +'<div class="verdict '+(b.liqOK?'pass':'fail')+'">'+(b.liqOK?'✓ PASSES the liquidity gate — order at MID, bracket on the ticket':'✗ Liquidity gate: '+(b.spread>0.30?'spread wide ':'')+(b.oi<500?'OI thin':'')+' — trade smaller or pick an alternate')+'</div>'
    +'<div class="go2"><a onclick="sendToCoach('+ix+')">🧭 COACH THIS CONTRACT</a>'
    +'<a href="cockpit.html?tk='+tk+'">🎛 COCKPIT '+tk+'</a></div>'
    +'</div>';
  const others=P.cands.map((a,k)=>({a,k})).filter(x=>x.k!==ix);
  if(others.length){h+='<div style="font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:4px 0 6px">Alternates — tap one to give it the full card</div>';
    for(const {a,k} of others)h+='<div class="alt" onclick="renderPick('+k+')"><span class="nm">'+fmt(a.exp)+' $'+a.K.toFixed(a.K%1?2:0)+'</span>'
      +'<span class="dt">mid $'+a.mid.toFixed(2)+' · spr $'+a.spread.toFixed(2)+' · OI '+a.oi.toLocaleString()+' · Θ '+a.thPct.toFixed(1)+'%</span>'
      +'<span class="dl">Δ'+a.delta.toFixed(2)+'</span><span class="mk">'+(k===0?'★ orig':'view')+'</span></div>';}
  document.getElementById('out').innerHTML=h;
}
function sendToCoach(ix){
  const P=PK;if(!P)return;const b=P.cands[ix];
  let pos={};try{pos=JSON.parse(localStorage.getItem('kCoach_pos'))||{};}catch(e){}
  pos.tk=P.tk;pos.side=P.isC?'CALL':'PUT';pos.strike=b.K;
  pos.exp=b.exp.toISOString().slice(0,10);pos.oentry=b.mid.toFixed(2);pos.qty=pos.qty||'1';
  localStorage.setItem('kCoach_pos',JSON.stringify(pos));
  location.href='coach.html';
}
</script>
</body></html>
