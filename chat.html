<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kornis Copilot</title>
<style>
:root{--bg:#05080f;--panel:#0b1220;--panel2:#101a30;--line:#1b2946;--text:#dce4f2;--dim:#67769a;
--gold:#c9a030;--gold-soft:#e8c86a;--green:#3ddc84;--red:#ff5470;--amber:#ffb454}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
display:flex;flex-direction:column;max-width:560px;margin:0 auto}
/* header */
.hdr{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.hdr .coin{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#1e3f78,#0d2040 65%);
border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none;
font-family:Georgia,serif;font-weight:bold;color:#ffe488;font-size:18px}
.hdr .t1{font-size:14.5px;font-weight:800}
.hdr .t2{font-size:10px;color:var(--dim)}
.hdr a{margin-left:auto;color:var(--gold-soft);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.08em}
/* chat area */
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#8a6a14,#c9a030);color:#0a0a0a;border-bottom-right-radius:4px;font-weight:500}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai b{color:var(--gold-soft)}
.msg.sys{align-self:center;background:none;border:1px dashed var(--line);color:var(--dim);font-size:11px;max-width:96%;text-align:center;padding:8px 12px}
.typing{align-self:flex-start;color:var(--dim);font-size:12px;padding:6px 13px}
.typing .dot{display:inline-block;animation:blink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
/* quick chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 12px 4px;flex:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.qchip{flex:none;font-size:11px;padding:7px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);color:var(--gold-soft);font-weight:600;cursor:pointer}
.qchip:active{border-color:var(--gold)}
/* input bar */
.bar{display:flex;gap:8px;padding:9px 12px max(12px, env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);flex:none}
.bar textarea{flex:1;background:#0a1120;border:1px solid var(--line);border-radius:12px;color:#fff;font-size:16px;padding:11px 13px;outline:none;resize:none;height:46px;max-height:110px;font-family:inherit;line-height:1.4}
.bar textarea:focus{border-color:var(--gold)}
.bar button{flex:none;width:46px;height:46px;border-radius:12px;border:none;background:linear-gradient(135deg,#a07818,var(--gold));color:#000;font-size:18px;font-weight:800;cursor:pointer}
.bar button:disabled{opacity:.4}
</style></head><body>

<div class="hdr">
  <div class="coin">K</div>
  <div><div class="t1">Kornis Copilot</div><div class="t2" id="ctxLine">loading context…</div></div>
  <a href="hub.html">COMMAND</a>
</div>

<div id="chat"></div>

<div class="chips" id="chips">
  <span class="qchip" onclick="quick('Give me the morning brief: read the overnight tape, the vol complex, and the yen against my 159 trigger, then tell me the posture for today.')">☀ Brief me</span>
  <span class="qchip" onclick="quick('Review my open positions one by one. For each: hold, scale, or exit — and why. Be blunt.')">⚑ Review my positions</span>
  <span class="qchip" onclick="quick('Search for any news or scheduled catalysts on SPCX in the next 5 trading days that could hit my contracts.')">🔍 SPCX catalysts</span>
  <span class="qchip" onclick="quick('Play devil\u2019s advocate: what is the strongest case AGAINST my current positioning right now?')">😈 Argue against me</span>
  <span class="qchip" onclick="quick('Where are we in the Path 1 / Path 2 framework right now, and what would flip it?')">🗺 Path check</span>
  <span class="qchip" onclick="clearChat()">🗑 Clear</span>
</div>

<div class="bar">
  <textarea id="inp" placeholder="Talk trades… (positions & tape auto-attached)" rows="1"></textarea>
  <button id="sendBtn" onclick="send()">➤</button>
</div>

<script>
const RELAY='https://kornis-ai-relay.rick-018.workers.dev';
const CKEY='kChat_v1', TKEY='kTrades_v1';
let HIST=[];try{HIST=JSON.parse(localStorage.getItem(CKEY))||[];}catch(e){}
let TAPE=null, BUSY=false;
const chat=document.getElementById('chat');

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function bubble(role,text){const d=document.createElement('div');
d.className='msg '+role;d.innerHTML=role==='ai'?md(text):esc(text);
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function sysNote(t){const d=document.createElement('div');d.className='msg sys';d.textContent=t;
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

/* restore history */
if(HIST.length){for(const m of HIST)bubble(m.role==='user'?'user':'ai',m.content);}
else sysNote('Private line to your AI second chair. It knows the Kornis Protocol, sees your open positions and the live tape, and can search the web. Uses your API credits — costs pennies per exchange.');

/* live context */
async function loadCtx(){
try{const r=await fetch(RELAY+'/?quotes=1');TAPE=(await r.json()).quotes||{};
const jp=TAPE['JPY=X'],vx=TAPE['^VIX'];
document.getElementById('ctxLine').textContent=
'¥'+(jp?jp.price.toFixed(2):'—')+' · VIX '+(vx?vx.price.toFixed(1):'—')+' · '+openPos().length+' open positions';
}catch(e){document.getElementById('ctxLine').textContent='tape offline · '+openPos().length+' open positions';}}
loadCtx();
function openPos(){try{return (JSON.parse(localStorage.getItem(TKEY))||[]).filter(t=>t.status==='open');}catch(e){return[];}}
function closedPos(){try{return (JSON.parse(localStorage.getItem(TKEY))||[]).filter(t=>t.status==='closed');}catch(e){return[];}}

function buildSystem(){
const now=new Date();
let s='You are the Kornis Copilot — the private trading second chair for Rick, a disciplined long-only options day trader (calls and puts only, no spreads, no shorting, typical hold 1–3 days, occasional swings).\n\n';
s+='THE KORNIS PROTOCOL YOU ENFORCE:\n';
s+='- Dual-path macro framework gated by USD/JPY: Path 1 = bull/wash cycle continues; Path 2 = carry-unwind capitulation, trigger at 159. VIX backwardation and violent yen strengthening confirm each other at risk-off lows.\n';
s+='- Confluence over single signals. Divergence is the master signal. Signal hierarchy: Tier 1 (triple divergence, TD-9 at extreme, capitulation volume) = act; Tier 2 = act on trigger; Tier 3 = watch; single indicators = noise.\n';
s+='- Vehicle selection by IV: rich premium (IV >> HV) -> deep ITM ~0.70 delta to cut vega; fair -> ATM 0.45–0.55; OTM only at Tier-1 confluence with a fast catalyst. Never sub-0.15 delta.\n';
s+='- Theta discipline: exit before the final 21 DTE; never round-trip a double; scale out into strength; Friday entries on short-dated contracts start underwater.\n';
s+='- The Eleven Gates (pre-trade checklist) are sacred. If he has not run the Gates on a contract, remind him once, briefly.\n\n';
s+='CURRENT DATE/TIME: '+now.toString()+'\n\n';
if(TAPE){s+='LIVE TAPE (15–20 min delayed):\n';
const nm={'ES=F':'S&P Futures','^FTSE':'FTSE','^GDAXI':'DAX','^N225':'Nikkei','JPY=X':'USD/JPY','^VIX':'VIX','^VIX9D':'VIX9D','^VIX3M':'VIX3M','^VVIX':'VVIX','^SKEW':'SKEW'};
for(const k in nm){const q=TAPE[k];if(q&&q.price!=null)s+='- '+nm[k]+': '+q.price.toFixed(2)+(q.chgPct!=null?' ('+(q.chgPct>=0?'+':'')+q.chgPct.toFixed(2)+'%)':'')+'\n';}
s+='\n';}
const op=openPos();
if(op.length){s+='HIS OPEN POSITIONS:\n';
for(const t of op){const dte=Math.ceil((new Date(t.expiry+'T16:00:00')-now)/86400000);
s+='- '+t.tk+' $'+t.strike+' '+(t.type==='C'?'CALL':'PUT')+' x'+t.qty+', entry $'+t.entry+(t.cur?', last $'+t.cur:'')+', '+dte+' DTE, '+t.tier+(t.notes?', setup: '+t.notes:'')+'\n';}
s+='\n';}else s+='HIS OPEN POSITIONS: none currently.\n\n';
const cl=closedPos();
if(cl.length){const tot=cl.reduce((s2,t)=>s2+(t.pl||0),0);const w=cl.filter(t=>t.pl>0).length;
s+='HIS TRACK RECORD: '+cl.length+' closed trades, '+Math.round(w/cl.length*100)+'% win rate, total P/L $'+tot.toFixed(0)+'.\n\n';}
s+='HOW TO BEHAVE:\n- Terse, blunt, production-ready. He hates fluff and hand-holding.\n- Use web search whenever catalysts, news, earnings dates, or anything time-sensitive matters — never guess at current events.\n- Numbers over adjectives. When you recommend, name the strike, expiry, and level.\n- You are a second opinion for his judgment, not a licensed advisor — no need to repeat disclaimers more than once per conversation, and only if genuinely relevant.\n- Challenge him when the setup is weak. Agreement is not your job; being right is.';
return s;}

function quick(t){document.getElementById('inp').value=t;send();}
function clearChat(){if(!confirm('Clear this conversation?'))return;
HIST=[];localStorage.removeItem(CKEY);chat.innerHTML='';sysNote('Cleared. Fresh line.');}

async function send(){
if(BUSY)return;
const inp=document.getElementById('inp');const text=inp.value.trim();if(!text)return;
inp.value='';bubble('user',text);
HIST.push({role:'user',content:text});
BUSY=true;document.getElementById('sendBtn').disabled=true;
const ty=document.createElement('div');ty.className='typing';
ty.innerHTML='Copilot is thinking<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;
try{
await loadCtx(); // fresh tape each turn
const msgs=HIST.slice(-14).map(m=>({role:m.role,content:m.content}));
const r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,system:buildSystem(),
messages:msgs,tools:[{type:'web_search_20250305',name:'web_search'}]})});
const j=await r.json();
if(j.error)throw new Error(j.error.message||'API error');
const parts=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text);
const reply=parts.join('\n').trim()||'(no reply — check relay and credits)';
ty.remove();bubble('ai',reply);
HIST.push({role:'assistant',content:reply});
localStorage.setItem(CKEY,JSON.stringify(HIST.slice(-40)));
}catch(e){ty.remove();bubble('sys','Failed: '+(e.message||'connection')+' — check the relay key and your credit balance at platform.claude.com.');}
finally{BUSY=false;document.getElementById('sendBtn').disabled=false;}}

document.getElementById('inp').addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body></html>
