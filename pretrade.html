<style>
  :root{
    --bg:#0B1220; --panel:#121B2E; --panel2:#0F1728; --line:#233150;
    --navy:#1F3864; --gold:#BF9000; --gold-soft:#D9B44A;
    --text:#E8ECF4; --dim:#8A93A6;
    --green:#2FB673; --red:#E05B44; --amber:#E0A93F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.5;padding-bottom:120px}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  header{padding:26px 0 18px;border-bottom:2px solid var(--gold);background:linear-gradient(180deg,#101A30,#0B1220)}

  h1{font-family:'Source Serif 4',Georgia,serif;font-size:26px;font-weight:600;color:#fff}
  .sub{font-size:12px;color:var(--dim);margin-top:6px}
  .sub a{color:var(--gold-soft);font-size:11px;text-decoration:none;letter-spacing:.1em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 16px;margin:16px 0}
  .card h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2 .n{background:var(--gold);color:#0B1220;border-radius:4px;padding:1px 6px;font-size:10px;letter-spacing:0}
  label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
  .lbl{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
  .info-i{width:18px;height:18px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-soft);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:none;font-family:'Source Serif 4',Georgia,serif;font-style:italic}
  input[type=text],input[type=number],select,textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:16px;padding:11px 12px;-webkit-appearance:none}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}

<script>
const RELAY='https://kornis-ai-relay.rick-018.workers.dev';
const num=id=>{const v=parseFloat(document.getElementById(id).value);return isNaN(v)?null:v;};
const txt=id=>document.getElementById(id).value.trim();

/* ================= BLACK-SCHOLES GREEKS ================= */
function normalCDF(x){
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign=x<0?-1:1; x=Math.abs(x)/Math.sqrt(2);
  const t=1/(1+p*x),y=1-((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*y);
}
function normalPDF(x){
  return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI);
}
function blackScholes(S,K,T,r,sigma,type='call'){
  if(T<=0||sigma<=0)return null;
  const d1=(Math.log(S/K)+(r+0.5*sigma*sigma)*T)/(sigma*Math.sqrt(T));
  const d2=d1-sigma*Math.sqrt(T);
  const Nd1=normalCDF(d1),Nd2=normalCDF(d2),nPd1=normalPDF(d1);
  const e_rT=Math.exp(-r*T);
  const greeks={};
  if(type==='call'){
    greeks.delta=Nd1;
    greeks.theta=(-S*nPd1*sigma/(2*Math.sqrt(T))-r*K*e_rT*Nd2)/365;
  }else{
    greeks.delta=Nd1-1;
    const N_d1=normalCDF(-d1),N_d2=normalCDF(-d2);
    greeks.theta=(-S*nPd1*sigma/(2*Math.sqrt(T))+r*K*e_rT*N_d2)/365;
  }
  greeks.gamma=nPd1/(S*sigma*Math.sqrt(T));
  greeks.vega=S*nPd1*Math.sqrt(T)/100;
  return greeks;
}

let direction=null;
function setDir(d){
  direction=d;
  document.getElementById('dirCall').classList.toggle('on',d==='call');
  document.getElementById('dirPut').classList.toggle('on',d==='put');
}
setDir('call');

let CHAIN_DATA=null;

/* ================= FETCH IV & GREEKS ================= */
async function fetchIVAndGreeks(){
  const tk=txt('ticker').toUpperCase();if(!tk)return;
  if(!direction)return;
  const btn=document.getElementById('ivBtn');const st=document.getElementById('ivStatus');
  btn.disabled=true;btn.textContent='FETCHING…';st.innerHTML='Pulling chain…';
  try{
    const r=await fetch(RELAY+'/?chain='+encodeURIComponent(tk));
    const j=await r.json();
    CHAIN_DATA=j;
    const spot=j?.data?.current_price??j?.data?.close;
    if(!spot){throw new Error('no spot price');}
    document.getElementById('price').value=spot.toFixed(2);
    
    const raw=j?.data?.options||[];
    if(!raw.length)throw new Error('no option chain');
    
    // Parse strikes and compute IVs, filter for direction
    const opts=[];
    for(const o of raw){
      const m=(o.option||'').match(/(\d{6})([CP])(\d{8})$/);if(!m)continue;
      const k=+m[3]/1000;const type=m[2];if((direction==='call'&&type!=='C')||(direction==='put'&&type!=='P'))continue;
      const exp=new Date(2000+ +m[1].slice(0,2),+m[1].slice(2,4)-1,+m[1].slice(4,6));
      const dte=Math.ceil((exp-new Date())/86400000);if(dte<1)continue;
      const iv=(o.implied_volatility??0)*100;
      opts.push({strike:k,iv,dte,bid:o.bid||0,ask:o.ask||0,exp});
    }
    if(!opts.length)throw new Error('no valid options');
    opts.sort((a,b)=>Math.abs(a.strike-spot)-Math.abs(b.strike-spot));
    
    // Use ATM IV
    const atmOpt=opts[0];
    document.getElementById('iv').value=atmOpt.iv.toFixed(1);
    document.getElementById('dte').value=atmOpt.dte;
    
    // Fetch technicals (RSI, MACD, ATR) from chart
    try{
      const tr=await fetch(RELAY+'/?tech='+encodeURIComponent(tk));
      const tj=await tr.json();
      if(tj?.data){
        const tech=tj.data;
        if(tech.rsi!=null)document.getElementById('rsi').value=tech.rsi.toFixed(0);
        if(tech.macd_line!=null)document.getElementById('macdline').value=tech.macd_line.toFixed(2);
        if(tech.macd_signal!=null)document.getElementById('signalline').value=tech.macd_signal.toFixed(2);
        if(tech.atr!=null)document.getElementById('atr').value=tech.atr.toFixed(2);
        if(tech.momentum!=null)document.getElementById('momentum').value=tech.momentum.toFixed(2);
      }
    }catch(e){}
    
    // Build Greeks matrix for 9 strikes (±4 from ATM)
    const atm=opts[0];const nearby=opts.slice(0,9);
    buildGreeksMatrix(spot,atm.iv/100,atm.dte,nearby,direction);
    
    st.innerHTML='Fetched '+opts.length+' options · ATM IV '+atmOpt.iv.toFixed(1)+'% · '+atmOpt.dte+' DTE';
    btn.textContent='REFRESH IV & GREEKS';
  }catch(e){
    st.innerHTML='<b>Failed:</b> '+(e.message||'connection')+'. Check relay and chain availability.';
  }finally{
    btn.disabled=false;
  }
}

function buildGreeksMatrix(spot,iv,dte,strikes,dir){
  const T=dte/365;const r=0.05;const type=dir==='call'?'call':'put';
  let html='<div class="greeks-header"><div>Strike</div><div>Δ Delta</div><div>Γ Gamma</div><div>Θ Theta</div><div>ν Vega</div></div>';
  for(const s of strikes){
    const g=blackScholes(spot,s.strike,T,r,iv,type);
    if(!g)continue;
    const isITM=(type==='call'&&s.strike<=spot)||(type==='put'&&s.strike>=spot);
    html+=`<div class="greeks-row" onclick="fillGreeks(${s.strike},${g.delta.toFixed(3)},${g.gamma.toFixed(4)},${g.theta.toFixed(4)},${g.vega.toFixed(3)})" style="cursor:pointer;background:rgba(201,160,48,0.05)">
      <div class="greeks-strike">$${s.strike.toFixed(0)}</div>
      <div class="greeks-cell delta ${isITM?'itm':''}">${(g.delta).toFixed(2)}</div>
      <div class="greeks-cell gamma">${(g.gamma).toFixed(3)}</div>
      <div class="greeks-cell theta">${(g.theta).toFixed(3)}</div>
      <div class="greeks-cell vega">${(g.vega).toFixed(2)}</div>
    </div>`;
  }
  document.getElementById('greeksMatrix').innerHTML=html;
  document.getElementById('greeksContainer').style.display='block';
  document.getElementById('greeksNote').innerHTML=`<b>Click any row to fill the Greeks in the Contract section above.</b> Delta = probability & $/move. Theta = daily decay. Vega = $/1% IV.`;
}

function fillGreeks(strike,delta,gamma,theta,vega){
  document.getElementById('strike').value=strike.toFixed(2);
  document.getElementById('delta').value=delta;
  document.getElementById('gamma').value=gamma;
  document.getElementById('theta').value=theta;
  document.getElementById('vega').value=vega;
}

const INFO={
  thesis:{t:'Thesis in One Sentence',b:'The entire premise in a single conditional sentence. "If X happens, then Y follows and the option makes money." This filters noise: if you cannot say the thesis in one sentence, you don\'t understand the setup well enough to trade it.'},
  delta:{t:'Delta',b:'Two readings in one number. First: how much the option gains per $1 stock move — 0.45 delta earns about $45 per contract per dollar. Second: a rough probability the option finishes in the money — 0.45 is priced as a coin-flip-ish shot. The gate wants 0.35–0.55: real participation without lottery pricing.'}
};

/* ================= CLAUDE CHAT ================= */
let CHAT_HISTORY=[];
function openChat(){
  CHAT_HISTORY=[];
  document.getElementById('chatMessages').innerHTML='';
  document.getElementById('chatTextarea').value='';
  document.getElementById('chatWrap').classList.add('open');
  const greeting='I\'ve loaded your setup. Ask me anything: "Does this match Path 2?" "What\'s the risk?" "Should I size this down?" etc.';
  addChatMessage('ai',greeting);
}
function closeChat(){
  document.getElementById('chatWrap').classList.remove('open');
  CHAT_HISTORY=[];
}
function addChatMessage(role,text){
  const msg=document.createElement('div');
  msg.className='chatMsg '+role;
  msg.innerHTML=role==='ai'?text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'):text;
  document.getElementById('chatMessages').appendChild(msg);
  document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;
}
function buildChatContext(){
  const ctx={
    ticker:txt('ticker'),direction:direction==='call'?'CALL':'PUT',thesis:txt('thesis'),
    price:num('price'),iv:num('iv'),ivRank:num('ivrank'),atr:num('atr'),
    rsi:num('rsi'),macdLine:num('macdline'),macdSignal:num('signalline'),
    momentum:num('momentum'),delta:num('delta'),gamma:num('gamma'),theta:num('theta'),vega:num('vega'),
    strike:num('strike'),dte:num('dte'),location:txt('location'),
    target:txt('target'),stop:txt('stop'),timeStop:txt('timestop')
  };
  return ctx;
}
async function sendChat(){
  const txt_input=document.getElementById('chatTextarea').value.trim();
  if(!txt_input)return;
  addChatMessage('user',txt_input);
  document.getElementById('chatTextarea').value='';
  document.getElementById('chatBtn').disabled=true;
  const typing=document.createElement('div');typing.className='chatTyping';typing.textContent='Claude is thinking…';
  document.getElementById('chatMessages').appendChild(typing);
  CHAT_HISTORY.push({role:'user',content:txt_input});
  try{
    const ctx=buildChatContext();
    const systemPrompt=`You are Claude, reviewing a trade setup against the Kornis Protocol. The user is a disciplined long-only options day trader (calls/puts only, 1-3 day holds). 

KORNIS PROTOCOL:
- Dual-path macro: Path 1 = wash cycle; Path 2 = carry-unwind (trigger USD/JPY ≥159)
- Confluence over single signals; signal hierarchy: Tier 1 > Tier 2 > Tier 3
- Vehicle selection by IV: rich IV → deep ITM ~0.70 delta; fair IV → ATM 0.45-0.55; OTM only at Tier 1 confluence
- Exit discipline: don't round-trip a double; scale into strength; final 21 DTE = exit plan
- The Eleven Gates are sacred: if setup hasn't run them, remind once

CURRENT SETUP:
${JSON.stringify(ctx,null,2)}

Be terse, blunt, production-ready. Challenge weak setups. This is a second opinion, not a recommendation.`;
    const r=await fetch(RELAY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,system:systemPrompt,messages:CHAT_HISTORY})});
    const j=await r.json();
    if(j.error)throw new Error(j.error.message||'API error');
    const reply=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim()||'(no reply)';
    typing.remove();addChatMessage('ai',reply);
    CHAT_HISTORY.push({role:'assistant',content:reply});
  }catch(e){
    typing.remove();addChatMessage('ai','<b>Failed:</b> '+(e.message||'connection')+'. Check relay.');
  }finally{
    document.getElementById('chatBtn').disabled=false;
  }
}
function info(key){
  const d=INFO[key];if(!d)return;
  document.getElementById('mTitle').textContent=d.t;
  document.getElementById('mBody').innerHTML=d.b;
  document.getElementById('modalWrap').classList.add('open');
}
function closeInfo(){document.getElementById('modalWrap').classList.remove('open');}
